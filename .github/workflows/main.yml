name: Main
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - '**'
env:
  CARGO_TERM_COLOR: always
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 🛠️ Install dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev libwayland-dev libxkbcommon-dev libvulkan-dev mesa-vulkan-drivers
      - name: 📎 Clippy
        run: cargo clippy -- -D warnings
      - name: 🧹 RustFmt
        run: cargo fmt --all -- --check
      - name: 🚫 UI F16 check
        run: bash .forgejo/ci/check-ui-f16.sh
      - name: 🧱 UI example smoke builds
        run: cargo check -p template_ui -p template_all_in_one -p template_minimal_3d -p template_minimal_2d
  test:
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'release/')
    steps:
      - uses: actions/checkout@v7
      - name: 🛠️ Install dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev libwayland-dev libxkbcommon-dev libvulkan-dev mesa-vulkan-drivers
      - name: 🧪 Test
        run: cargo test --no-fail-fast
  # GitHub-only: Forgejo has no macOS runners.
  ios:
    if: github.server_url == 'https://github.com'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Select iOS simulator target
        id: target
        run: |
          case "$(uname -m)" in
            arm64) triple=aarch64-apple-ios-sim ;;
            x86_64) triple=x86_64-apple-ios ;;
            *) echo "Unsupported host architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          echo "triple=$triple" >> "$GITHUB_OUTPUT"
      - name: Install Rust target
        run: rustup target add "${{ steps.target.outputs.triple }}"
      - name: Check iOS simulator build
        run: cargo check -p template_minimal_3d --lib --target "${{ steps.target.outputs.triple }}"
