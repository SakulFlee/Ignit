[package]
name = "ignit_debug_ui"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Debug overlay UI for the Ignit game engine (performance, ECS inspector, console)"

[dependencies]
cgmath = { workspace = true }
log = { workspace = true }
winit = { workspace = true }

ignit_app = { path = "../app", version = "1.6.3" }
ignit_billboard = { path = "../billboard", version = "1.6.3" }
ignit_camera = { path = "../camera", version = "1.6.3" }
ignit_core = { path = "../core", version = "1.6.3" }
ignit_debug_render = { path = "../debug_render", version = "1.6.3" }
ignit_ecs = { path = "../ecs", version = "1.6.3" }
ignit_ecs_bridge = { path = "../ecs_bridge", version = "1.6.3" }
ignit_iced = { path = "../iced", version = "1.6.3" }
ignit_material_shader = { path = "../material_shader", version = "1.6.3" }
ignit_renderer = { path = "../renderer", version = "1.6.3" }

# Iced sub-crates, matching ignit_iced so the types line up.
iced_core = { workspace = true }
iced_widget = { workspace = true, features = ["wgpu"] }
iced_wgpu = { workspace = true }
iced_winit = { workspace = true }

[dev-dependencies]
ignit_animation = { path = "../animation", version = "1.6.3" }
ignit_math = { path = "../math", version = "1.6.3" }
ignit_mesh = { path = "../mesh", version = "1.6.3" }
ignit_world_environment = { path = "../world_environment", version = "1.6.3" }
