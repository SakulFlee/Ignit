[package]
name = "ignit_resources"
description = "Compatibility re-exports for Ignit resource crates"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ignit_animation = { path = "../animation", version = "1.6.3" }
ignit_camera = { path = "../camera", version = "1.6.3" }
ignit_cull = { path = "../cull", version = "1.6.3" }
ignit_ibl_brdf = { path = "../ibl_brdf", version = "1.6.3" }
ignit_instance = { path = "../instance", version = "1.6.3" }
ignit_light = { path = "../light", version = "1.6.3" }
ignit_material_shader = { path = "../material_shader", version = "1.6.3" }
ignit_math = { path = "../math", version = "1.6.3" }
ignit_mesh = { path = "../mesh", version = "1.6.3" }
ignit_model = { path = "../model", version = "1.6.3" }
ignit_shader_core = { path = "../shader_core", version = "1.6.3" }
ignit_shader_compute = { path = "../shader_compute", version = "1.6.3" }
ignit_shader_pbr = { path = "../shader_pbr", version = "1.6.3" }
ignit_shadow = { path = "../shadow", version = "1.6.3" }
ignit_texture = { path = "../texture", version = "1.6.3" }
ignit_vertex = { path = "../vertex", version = "1.6.3" }
ignit_world_environment = { path = "../world_environment", version = "1.6.3" }

[dev-dependencies]
ignit_shader_engine = { path = "../shader_engine", version = "1.6.3" }
ignit_shader_math = { path = "../shader_math", version = "1.6.3" }
ignit_shader_preprocessor = { path = "../shader_preprocessor", version = "1.6.3" }
naga = { version = "30.0.0", default-features = false, features = ["wgsl-in"] }
