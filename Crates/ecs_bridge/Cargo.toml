[package]
name = "ignit_ecs_bridge"
description = "Engine ECS components and resources for Ignit"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ignit_macros = { path = "../macros", version = "1.6.3" }
ignit_core = { path = "../core", version = "1.6.3" }
ignit_ecs = { path = "../ecs", version = "1.6.3" }
ignit_importer_gltf = { path = "../importer_gltf", version = "1.6.3" }
ignit_animation = { path = "../animation", version = "1.6.3" }
ignit_camera = { path = "../camera", version = "1.6.3" }
ignit_cull = { path = "../cull", version = "1.6.3" }
ignit_ibl_brdf = { path = "../ibl_brdf", version = "1.6.3" }
ignit_light = { path = "../light", version = "1.6.3" }
ignit_material_shader = { path = "../material_shader", version = "1.6.3" }
ignit_math = { path = "../math", version = "1.6.3" }
ignit_mesh = { path = "../mesh", version = "1.6.3" }
ignit_model = { path = "../model", version = "1.6.3" }
ignit_shadow = { path = "../shadow", version = "1.6.3" }
ignit_world_environment = { path = "../world_environment", version = "1.6.3" }
cgmath = { workspace = true }
hashbrown = { workspace = true }
ignit_input = { path = "../input", version = "1.6.3" }
ulid = { workspace = true }
wgpu = { workspace = true }
winit = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Linux needs a winit backend selected explicitly. `ignit_iced` enables
# these through its own Linux target section; bridge crates that reach winit
# without pulling iced must do the same so standalone crate builds work.
winit = { workspace = true, features = ["x11", "wayland"] }
