name: Publish Crates

# Manual-only. Publishing is permanent on crates.io, so this workflow never
# runs on a tag, push, or pull request. Branch refs are dry-run only; tag refs
# may publish when the tag matches the workspace version. Start it from the
# Actions tab.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry-Run (package, compile and check licenses)
        type: boolean
        default: true
      crates:
        description: Space-separated crate names; empty publishes the whole workspace
        type: string
        required: false
        default: ""

concurrency:
  group: publish-crates
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: forgejo.sakul-flee.de/sakulflee/ignit-ci-build-image:latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      CARGO_INCREMENTAL: 0
      RUSTC_WRAPPER: sccache
      SCCACHE_CACHE_SIZE: 10G
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version and validate
        id: version
        shell: bash
        run: |
          set -euo pipefail

          ref="${{ github.ref }}"
          ref_name="${ref#refs/tags/}"
          if [ "$ref_name" = "$ref" ]; then
            ref_name="${ref#refs/heads/}"
          fi

          case "$ref" in
            refs/tags/*) ref_type=tag ;;
            refs/heads/*) ref_type=branch ;;
            *)
              echo "Unsupported ref: $ref" >&2
              exit 1
              ;;
          esac

          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "ignit") | .version')"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ref_type=$ref_type" >> "$GITHUB_OUTPUT"
          echo "Workspace version: $version (ref: $ref_name, $ref_type)"

          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "CARGO_REGISTRY_TOKEN is not configured" >&2
            exit 1
          fi

          if [ "$ref_type" = "branch" ] && [ "${{ inputs.dry_run }}" = "false" ]; then
            echo "Refusing to publish: branches are dry-run only. Run from a v$version tag." >&2
            exit 1
          fi

          if [ "$ref_type" = "tag" ]; then
            tag_version="${ref_name#v}"
            if [ "$tag_version" = "$ref_name" ]; then
              echo "Refusing: tag must start with v" >&2
              exit 1
            fi

            if [ "$tag_version" != "$version" ]; then
              echo "Refusing: tag $ref_name does not match workspace version $version" >&2
              exit 1
            fi

            exact="$(git describe --tags --exact-match 2>/dev/null || true)"
            if [ "$exact" != "$ref_name" ]; then
              echo "Refusing: checkout is not exactly at tag $ref_name" >&2
              exit 1
            fi
          fi

      - name: Compile workspace
        run: cargo check --workspace --locked

      - name: License check
        shell: bash
        run: |
          set -euo pipefail

          selected="${{ inputs.crates }}"

          cargo metadata --no-deps --format-version 1 > /tmp/metadata.json

          while IFS=$'\t' read -r name license manifest; do
            if [ -z "$license" ]; then
              echo "Missing license metadata for $name" >&2
              exit 1
            fi

            directory="$(dirname "$manifest")"
            if ! compgen -G "$directory/LICENSE*" >/dev/null \
              && ! compgen -G "$directory/COPYING*" >/dev/null; then
              echo "No license file in $directory" >&2
              exit 1
            fi

            echo "ok: $name ($license)"
          done < <(jq -r --arg selected "$selected" '
            .packages[]
            | select(.publish != [])
            | select($selected == ""
                or (.name as $name
                    | ($selected | split(" ") | index($name)) != null))
            | [.name, .license // "", .manifest_path]
            | @tsv
          ' /tmp/metadata.json)

          # Verify that Cargo includes the license in its package file list.
          if ! cargo package --list -p ignit_2d --allow-dirty \
            | grep -qE '^(LICENSE|LICENCE|COPYING|NOTICE)'; then
            echo "Cargo did not include a license file in ignit_2d" >&2
            exit 1
          fi

      - name: Publish
        if: ${{ inputs.dry_run == false }}
        shell: bash
        run: |
          set -euo pipefail

          selected="${{ inputs.crates }}"

          while true; do
            cargo metadata --no-deps --format-version 1 > /tmp/metadata.json

            mapfile -t names < <(jq -r --arg selected "$selected" '
              .packages[]
              | select(.publish != [])
              | select($selected == ""
                  or (.name as $name
                      | ($selected | split(" ") | index($name)) != null))
              | .name
            ' /tmp/metadata.json)

            if [ ${#names[@]} -eq 0 ]; then
              echo "No matching publishable crates" >&2
              exit 1
            fi

            args=()
            excludes=()
            pending=0

            if [ -z "$selected" ]; then
              args=(--workspace)
            fi

            for name in "${names[@]}"; do
              version="$(jq -r --arg name "$name" \
                '.packages[] | select(.name == $name) | .version' \
                /tmp/metadata.json)"

              if curl -fsS -A "ignit-publish-workflow" \
                "https://crates.io/api/v1/crates/${name}/${version}" \
                >/dev/null 2>&1; then
                if [ -z "$selected" ]; then
                  excludes+=(--exclude "$name")
                fi
                continue
              fi

              pending=$((pending + 1))
              if [ -n "$selected" ]; then
                args+=(-p "$name")
              fi
            done

            if [ "$pending" -eq 0 ]; then
              echo "All selected crates are already published at this version."
              break
            fi

            echo "Publishing $pending crate(s)..."
            if output="$(cargo publish "${args[@]}" "${excludes[@]}" 2>&1)"; then
              printf '%s\n' "$output"
              echo "PUBLISH COMPLETE"
              break
            fi

            printf '%s\n' "$output"

            if printf '%s' "$output" | grep -q '429 Too Many Requests'; then
              when="$(printf '%s\n' "$output" \
                | sed -n 's/.*try again after \(.*\) GMT and see.*/\1 GMT/p' \
                | head -1)"
              target="$(date -u -d "$when" +%s 2>/dev/null || echo 0)"
              now="$(date -u +%s)"
              wait=$((target - now + 30))
              [ "$wait" -lt 60 ] && wait=60
              echo "Rate limited; waiting ${wait}s until $when"
              sleep "$wait"
              continue
            fi

            if printf '%s' "$output" | grep -Eq 'already (exists|uploaded)'; then
              echo "Registry changed during the run; retrying with a fresh published set."
              sleep 10
              continue
            fi

            echo "PUBLISH FAILED" >&2
            exit 1
          done

      - name: sccache stats
        if: always()
        run: sccache --show-stats
