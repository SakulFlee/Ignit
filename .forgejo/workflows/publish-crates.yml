name: Publish Crates

# Manual-only. Publishing is permanent on crates.io, so this workflow never
# runs on a tag, push, or pull request. Start it from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Package, compile and check licenses without uploading
        type: boolean
        default: true
      confirm:
        description: Type the workspace version to allow publishing
        type: string
        required: false
        default: ""
      crates:
        description: Space-separated crate names; empty publishes the whole workspace
        type: string
        required: false
        default: ""

concurrency:
  group: publish-crates
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: forgejo.sakul-flee.de/sakulflee/ignit-ci-build-image:latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      CARGO_INCREMENTAL: 0
      RUSTC_WRAPPER: sccache
      SCCACHE_CACHE_SIZE: 10G
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version and validate
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "ignit") | .version')"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Workspace version: $version"

          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "CARGO_REGISTRY_TOKEN is not configured" >&2
            exit 1
          fi

          if [ "${{ inputs.dry_run }}" = "false" ]; then
            if [ "${{ inputs.confirm }}" != "$version" ]; then
              echo "Refusing to publish: confirm must equal $version" >&2
              exit 1
            fi

            tag="$(git describe --tags --exact-match 2>/dev/null || true)"
            if [ "$tag" != "v$version" ]; then
              echo "Refusing to publish: expected tag v$version, found '${tag:-none}'" >&2
              exit 1
            fi
          fi

      - name: Compile workspace
        run: cargo check --workspace --locked

      - name: License check
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.version.outputs.version }}"
          selected="${{ inputs.crates }}"

          cargo metadata --no-deps --format-version 1 > /tmp/metadata.json

          while IFS= read -r crate; do
            [ -z "$crate" ] && continue
            case "$crate" in \#*) continue ;; esac

            if [ -n "$selected" ] && ! printf '%s\n' $selected | grep -qx "$crate"; then
              continue
            fi

            license="$(jq -r --arg c "$crate" \
              '.packages[] | select(.name == $c) | .license // empty' \
              /tmp/metadata.json)"
            if [ -z "$license" ]; then
              echo "Missing license metadata for $crate" >&2
              exit 1
            fi

            manifest="$(jq -r --arg c "$crate" \
              '.packages[] | select(.name == $c) | .manifest_path' \
              /tmp/metadata.json)"
            directory="$(dirname "$manifest")"

            if ! compgen -G "$directory/LICENSE*" >/dev/null \
              && ! compgen -G "$directory/COPYING*" >/dev/null; then
              echo "No license file in $directory" >&2
              exit 1
            fi

            echo "ok: $crate ($license)"
          done < .forgejo/ci/publish-order.txt

          # Verify that Cargo actually puts the file into a package tarball.
          cargo package -p ignit_2d --allow-dirty --no-verify
          if ! tar -tzf "target/package/ignit_2d-${version}.crate" \
            | grep -qiE '(^|/)(LICENSE|LICENCE|COPYING|NOTICE)'; then
            echo "Cargo did not include a license file in ignit_2d" >&2
            exit 1
          fi

      - name: Publish
        if: ${{ inputs.dry_run == false }}
        shell: bash
        run: |
          set -euo pipefail

          selected="${{ inputs.crates }}"

          while IFS= read -r crate; do
            [ -z "$crate" ] && continue
            case "$crate" in \#*) continue ;; esac

            if [ -n "$selected" ] && ! printf '%s\n' $selected | grep -qx "$crate"; then
              continue
            fi

            while true; do
              echo "=== $crate $(date -u +%FT%TZ)"

              if out="$(cargo publish -p "$crate" 2>&1)"; then
                printf '%s\n' "$out"
                echo "PUBLISHED $crate"
                break
              fi

              printf '%s\n' "$out"

              if printf '%s' "$out" | grep -Eq 'already (exists|uploaded)'; then
                echo "ALREADY PUBLISHED $crate"
                break
              fi

              if printf '%s' "$out" | grep -q '429 Too Many Requests'; then
                when="$(printf '%s\n' "$out" \
                  | sed -n 's/.*try again after \(.*\) GMT and see.*/\1 GMT/p' \
                  | head -1)"
                target="$(date -u -d "$when" +%s 2>/dev/null || echo 0)"
                now="$(date -u +%s)"
                wait=$((target - now + 30))
                [ "$wait" -lt 60 ] && wait=60
                echo "Rate limited; waiting ${wait}s until $when"
                sleep "$wait"
                continue
              fi

              echo "FAILED $crate" >&2
              exit 1
            done
          done < .forgejo/ci/publish-order.txt

      - name: sccache stats
        if: always()
        run: sccache --show-stats
